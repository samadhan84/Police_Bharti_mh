name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: police_bharti
          MYSQL_USER: pb_user
          MYSQL_PASSWORD: pb_pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpw" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5080
      ConnectionStrings__Default: "Server=127.0.0.1;Port=3306;Database=police_bharti;User=pb_user;Password=pb_pass;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build API
        run: dotnet build backend/PoliceBharti.Api -c Release
      - name: Build web app
        run: cd frontend && npm ci && npm run build
      - name: Start API
        run: |
          cd backend/PoliceBharti.Api
          nohup dotnet run -c Release --no-build > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:5080/api/health && exit 0; sleep 2; done
          cat /tmp/api.log; exit 1
      - name: Student flow smoke test
        run: backend/scripts/smoke.sh
      - name: Admin import smoke test
        run: backend/scripts/admin-smoke.sh
      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log
      - name: Package ready-to-run build (API + web app)
        run: |
          dotnet publish backend/PoliceBharti.Api -c Release -o build-out
          cp -r frontend/dist build-out/wwwroot
          cp backend/sample-data/questions.csv build-out/sample-questions.csv
          printf '%s\n' 'Run (needs .NET 8 runtime):' '  Linux/Mac: Database__Provider=sqlite ASPNETCORE_URLS=http://localhost:5080 ASPNETCORE_ENVIRONMENT=Development dotnet PoliceBharti.Api.dll' '  Windows PowerShell: $env:Database__Provider="sqlite"; $env:ASPNETCORE_ENVIRONMENT="Development"; $env:ASPNETCORE_URLS="http://localhost:5080"; dotnet PoliceBharti.Api.dll' 'Open http://localhost:5080  (admin: register admin@policebharti.local)' > build-out/RUN.txt
      - uses: actions/upload-artifact@v4
        with:
          name: police-bharti-build
          path: build-out
          retention-days: 30

  docker:
    # Builds the production image and runs it exactly like a host would (Production mode, $PORT, strong JWT key).
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: police_bharti
          MYSQL_USER: pb_user
          MYSQL_PASSWORD: pb_pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpw" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pb-app .
      - name: Run container
        run: |
          docker run -d --name pb --network host -e PORT=8080 \
            -e MYSQLHOST=127.0.0.1 -e MYSQLPORT=3306 -e MYSQLUSER=pb_user -e MYSQLPASSWORD=pb_pass -e MYSQLDATABASE=police_bharti \
            -e Jwt__Key=$(openssl rand -base64 48) -e Admin__Emails__0=owner@example.com pb-app
          for i in $(seq 1 40); do curl -sf http://localhost:8080/api/health && break; sleep 2; done
          curl -sf http://localhost:8080/ | grep -q "<title>Police Bharti"
      - name: Smoke tests against container
        run: backend/scripts/smoke.sh http://localhost:8080/api
      - name: Container log on failure
        if: failure()
        run: docker logs pb

  sqlite:
    # "No database server" test mode: SQLite file + questions loaded from sample CSV.
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5080
      Database__Provider: sqlite
      Database__SqlitePath: /tmp/test.db
      Seed__CsvPath: ${{ github.workspace }}/backend/sample-data/questions.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet build backend/PoliceBharti.Api -c Release
      - name: Start API (no MySQL)
        run: |
          cd backend/PoliceBharti.Api
          nohup dotnet run -c Release --no-build > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:5080/api/health && exit 0; sleep 2; done
          cat /tmp/api.log; exit 1
      - run: grep "\[seed\]" /tmp/api.log
      - run: backend/scripts/smoke.sh
      - run: backend/scripts/admin-smoke.sh
      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log
